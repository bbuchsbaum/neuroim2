name: release-runtime-profile
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  profile:
    if: startsWith(github.head_ref, 'release/cran-')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RCPP_PARALLEL_NUM_THREADS: 2
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
      MAKEFLAGS: -j2
      NOT_CRAN: false
      _R_CHECK_LIMIT_CORES_: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
      - name: Profile all evaluated vignette chunks
        shell: bash
        run: Rscript tools/release/profile-vignettes.R . "$RUNNER_TEMP/vignette-profile"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vignette-profile-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/vignette-profile
          retention-days: 30
